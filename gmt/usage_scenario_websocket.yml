---
# Fair WebSocket — echo (burst). One BEAM WS echo server + a WS load generator.
# Local runner.py: --variable "__GMT_VAR_BEAM_IMAGE__=fair-erlang-websocket"
name: Fair WebSocket (echo, burst, 50 clients)
author: fair-index-benchmarks
description: >
  One BEAM WebSocket echo server (Erlang or Elixir, behaviourally identical) plus a
  load generator running concurrent burst echo clients via tools/ws_load.py. Server
  performs the RFC 6455 handshake and echoes frames on port 80.

services:
  beam-server:
    image: __GMT_VAR_BEAM_IMAGE__

  loadgen:
    image: alpine:3.19
    folder-destination: /tmp/repo
    depends_on:
      - beam-server
    setup-commands:
      - command: apk add --no-cache python3 py3-pip
      - command: pip install --break-system-packages websockets

flow:
  - name: WebSocket workload (burst echo)
    container: loadgen
    commands:
      - type: console
        shell: sh
        command: python3 /tmp/repo/gmt/tools/ws_load.py --url ws://beam-server:80/ --pattern burst --clients 50 --size_kb 64 --bursts 2000 --startup_wait 2
